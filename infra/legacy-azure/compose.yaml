name: recipe-search
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    restart: unless-stopped
    mem_limit: 2560m
    environment:
      node.name: es01
      cluster.name: recipe-prototype
      discovery.type: single-node
      bootstrap.memory_lock: 'true'
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?required}
      xpack.security.enabled: 'true'
      xpack.security.http.ssl.enabled: 'true'
      xpack.security.http.ssl.key: certs${SSH_KEY_PATH}
      xpack.security.http.ssl.certificate: certs/es01/es01.crt
      xpack.security.http.ssl.certificate_authorities: certs/ca/ca.crt
      xpack.security.transport.ssl.enabled: 'true'
      xpack.security.transport.ssl.key: certs${SSH_KEY_PATH}
      xpack.security.transport.ssl.certificate: certs/es01/es01.crt
      xpack.security.transport.ssl.certificate_authorities: certs/ca/ca.crt
      xpack.security.transport.ssl.verification_mode: certificate
      xpack.license.self_generated.type: basic
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    ports:
      - 127.0.0.1:9200:9200
    volumes:
      - esdata:/usr/share/elasticsearch/data
      - ./certs:/usr/share/elasticsearch/config/certs:ro
    healthcheck:
      test: [CMD-SHELL, 'curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q "missing authentication credentials"']
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  kibana:
    image: docker.elastic.co/kibana/kibana:9.0.0
    restart: unless-stopped
    mem_limit: 1024m
    environment:
      SERVER_NAME: recipe-kibana
      SERVER_HOST: 0.0.0.0
      ELASTICSEARCH_HOSTS: '["https://elasticsearch:9200"]'
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:?required}
      ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES: /usr/share/kibana/config/ca.crt
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_SECURITY_KEY:?required}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_SAVEDOBJECTS_KEY:?required}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_REPORTING_KEY:?required}
      NODE_OPTIONS: --max-old-space-size=768
    ports:
      - 127.0.0.1:5601:5601
    volumes:
      - kibanadata:/usr/share/kibana/data
      - ./certs/ca/ca.crt:/usr/share/kibana/config/ca.crt:ro
    depends_on:
      elasticsearch: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:5601/api/status >/dev/null']
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  esdata:
  kibanadata:
